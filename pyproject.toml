[project]
name = "meo-gpt-connector"
version = "0.2.10"
description = "ChatGPT Custom GPT connector for Meo Mai Moi pet care platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.51.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "httpx>=0.28",
    "PyJWT>=2.13.0",
    "cryptography>=49.0.0",
    "redis[hiredis]>=8.0.1",
    "structlog>=26.1.0",
    "python-multipart>=0.0.32",
    "jinja2>=3.1",
    "tomllib>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "pytest-cov>=7.1.0",
    "httpx>=0.28",
    "ruff>=0.15.20",
    "mypy>=2.2.0",
    "locust>=2.44.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

[tool.uv]
dev-dependencies = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
    "mypy>=2.2.0",
    "locust>=2.44.4",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "B008",  # do not perform function calls in default arguments (FastAPI Depends pattern)
    "E501",  # line too long — OpenAPI/GPT description strings are intentionally verbose
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["src.routers.*", "src.main"]
disallow_untyped_defs = false
